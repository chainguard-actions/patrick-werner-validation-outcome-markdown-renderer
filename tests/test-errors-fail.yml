name: Test errors present cause failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bundle-file: tests/fixtures/bundle-mixed.json
          include: errors
          pr-summary-path: pr-summary-errors.md
      - name: Assert step failed because errors remain
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since 2 errors remain"
            exit 1
          fi
          echo "PASS"
      - name: Assert PR summary content
        run: |
          f="$GITHUB_WORKSPACE/pr-summary-errors.md"
          if [ ! -f "$f" ]; then echo "FAIL: $f not written"; exit 1; fi
          cat "$f"
          head -n1 "$f" | grep -qF '<!-- fhir-validation-summary -->' || { echo "FAIL: missing start marker"; exit 1; }
          tail -n1 "$f" | grep -qF '<!-- fhir-validation-summary -->' || { echo "FAIL: missing end marker"; exit 1; }
          for s in 'FHIR Validation Results (filter: errors)' \
                   '2 errors (0 filtered)' \
                   '1 warnings filtered out' \
                   '1 hints filtered out' \
                   'Patient-a.json' 'Observation-b.json' \
                   'Validation_VAL_Profile_Minimum' 'TERMINOLOGY_TX_NOVALID' \
                   'The magic LOINC code 12345-6 is not valid'; do
            grep -qF "$s" "$f" || { echo "FAIL: missing '$s'"; exit 1; }
          done
          for s in 'UNKNOWN_CODESYSTEM' 'BP_NARRATIVE' 'input/examples'; do
            if grep -qF "$s" "$f"; then echo "FAIL: unexpected '$s'"; exit 1; fi
          done
          echo "PASS"
