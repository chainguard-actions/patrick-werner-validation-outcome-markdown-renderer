name: Test missing bundle file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bundle-file: tests/fixtures/does-not-exist.json
          pr-summary-path: pr-summary-missing.md
      - name: Assert failure and no summary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing file"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/pr-summary-missing.md" ]; then
            echo "FAIL: summary should not be written"
            exit 1
          fi
          echo "PASS"
